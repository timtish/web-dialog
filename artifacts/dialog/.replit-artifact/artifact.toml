kind = "web"
previewPath = "/"
title = "Dialog"
description = "A warm, low-friction chat companion for an older adult. The first build focuses on a comfortable one-screen conversation experience with large type, gentle prompts, and a small daily weather glance."
version = "1.0.0"
id = "artifacts/dialog"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18995

[services.development]
run = "pnpm --filter @workspace/dialog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dialog", "run", "build" ]
serve = "static"
publicDir = "artifacts/dialog/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18995"
BASE_PATH = "/"
